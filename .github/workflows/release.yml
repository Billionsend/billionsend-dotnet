name: release

# Publishes the BillionSend package to nuget.org at the version the project
# declares, with NuGet Trusted Publishing: NuGet/login trades the job's OIDC
# token for a short-lived API key, so no key is stored. The only secret is
# NUGET_USER, the nuget.org account (not a key) that owns the Trusted Publishing
# policy. Run it by hand (Actions → release → Run workflow) on a version tag;
# see "Releasing" in the README.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # OIDC for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Only a tag that names the project's version publishes, so the number on
      # nuget.org is always a commit you can find.
      - name: Run from the tag of the project version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          version="$(dotnet msbuild src/BillionSend/BillionSend.csproj -getProperty:Version)"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python3 scripts/generate.py --check
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack src/BillionSend --no-build -c Release -o artifacts
      - name: Trade the OIDC token for a short-lived nuget.org key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1 (v1.2.0)
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushing the .nupkg pushes the .snupkg beside it to the symbol server too.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/BillionSend.*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
